<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo Oficial - Relicarios</title>
    <style>
        /* ========================================================
           TIPOGRAFÍA CATCHY MAGER
           ======================================================== */
        @font-face {
            font-family: 'Catchy Mager';
            src: local('Catchy Mager Regular'), local('CatchyMager-Normal');
            font-weight: normal;
            font-style: normal;
        }

        /* ========================================================
           PALETA DE COLORES OFICIAL
           ======================================================== */
        :root {
            --color-platinum: #DADDD8;
            --color-beige: #D0D8BA;       /* FONDO PRINCIPAL */
            --color-sage: #A6A277;
            --color-moss: #919063;
            --color-coyote: #84765C;      /* TEXTOS Y TÍTULOS */
            
            --radius-card: 16px;
            --shadow-subtle: 0 4px 15px rgba(132, 118, 92, 0.15);
            --shadow-hover: 0 8px 25px rgba(145, 144, 99, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Catchy Mager', serif; 
            background-color: var(--color-beige);
            color: var(--color-coyote);
            line-height: 1.6;
            min-height: 100vh;
        }

        /* HEADER & LOGO */
        header {
            text-align: center;
            padding: 40px 20px 20px;
            background-color: var(--color-platinum);
            border-bottom: 2px solid var(--color-sage);
            box-shadow: var(--shadow-subtle);
        }

        .logo {
            max-width: 220px;
            height: auto;
            margin-bottom: 10px;
            mix-blend-mode: multiply;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: normal;
            color: var(--color-coyote);
            letter-spacing: 2px;
        }

        /* BARRA DE CONTROLES */
        .controls-wrapper {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .control-input {
            font-family: 'Catchy Mager', serif;
            font-size: 1.1rem;
            padding: 12px 20px;
            border: 2px solid var(--color-sage);
            border-radius: 30px;
            background-color: var(--color-platinum);
            color: var(--color-coyote);
            outline: none;
            min-width: 250px;
            transition: border-color 0.3s ease;
        }

        .control-input:focus {
            border-color: var(--color-moss);
        }

        .control-input::placeholder {
            color: var(--color-sage);
        }

        /* GRILLA DE PRODUCTOS */
        .catalog-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
            padding-bottom: 80px;
        }

        .product-card {
            background-color: var(--color-platinum);
            border-radius: var(--radius-card);
            overflow: hidden;
            box-shadow: var(--shadow-subtle);
            transition: all 0.3s ease;
            cursor: pointer;
            border: 1px solid transparent;
            display: flex;
            flex-direction: column;
        }

        .product-card:hover {
            transform: translateY(-8px);
            box-shadow: var(--shadow-hover);
            border-color: var(--color-sage);
        }

        .card-image {
            width: 100%;
            height: 250px;
            background-color: #f5f5f5;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .card-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .product-card:hover .card-image img {
            transform: scale(1.05);
        }

        .card-content {
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            text-align: center;
        }

        .card-category {
            font-size: 0.9rem;
            color: var(--color-moss);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .card-title {
            font-size: 1.5rem;
            color: var(--color-coyote);
            margin-bottom: 10px;
        }

        .card-details {
            font-size: 1rem;
            color: var(--color-coyote);
            margin-top: auto;
            background: rgba(166, 162, 119, 0.15);
            padding: 10px;
            border-radius: 8px;
            border: 1px dashed var(--color-sage);
        }

        /* MODAL DE DETALLE */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(132, 118, 92, 0.8);
            backdrop-filter: blur(5px);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-overlay.open {
            display: flex;
        }

        .modal-box {
            background: var(--color-platinum);
            border: 2px solid var(--color-sage);
            border-radius: 20px;
            width: 100%;
            max-width: 800px;
            display: flex;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
            position: relative;
            max-height: 90vh;
        }

        .modal-close {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px solid var(--color-coyote);
            background: var(--color-beige);
            color: var(--color-coyote);
            font-size: 1.2rem;
            cursor: pointer;
            transition: 0.2s;
            z-index: 10;
        }

        .modal-close:hover {
            background: var(--color-coyote);
            color: var(--color-platinum);
        }
        
        .modal-img-col {
            flex: 1;
            min-height: 350px;
            background: var(--color-beige);
        }

        .modal-img-col img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .modal-info-col {
            flex: 1;
            padding: 40px 30px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow-y: auto;
        }

        .modal-info-col h2 {
            font-size: 2.2rem;
            color: var(--color-coyote);
            margin-bottom: 5px;
            line-height: 1.1;
        }

        .modal-info-col .cat {
            color: var(--color-moss);
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 2px;
            margin-bottom: 20px;
            display: block;
        }

        .specs-list {
            list-style: none;
            margin-top: 10px;
        }

        .specs-list li {
            font-size: 1.1rem;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--color-sage);
        }

        .specs-list li strong {
            color: var(--color-moss);
        }

        /* ESTADOS VACÍOS */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 50px 20px;
            font-size: 1.5rem;
            color: var(--color-coyote);
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .modal-box {
                flex-direction: column;
                overflow-y: auto;
            }
            .modal-img-col {
                min-height: 250px;
                flex: none;
            }
            .control-input {
                width: 100%;
            }
        }
    </style>
</head>

        // Renderizar las tarjetas
        function renderizarCatalogo() {

            const query = searchInput.value.toLowerCase();
            const cat = categoryFilter.value;

                const matchTexto = p.nombre.toLowerCase().includes(query) || p.id.toLowerCase().includes(query);
                const matchCategoria = (cat === 'all') || (p.categoria === cat);
                return matchTexto && matchCategoria;
            });

                grid.innerHTML = `<div class="empty-state">No hemos encontrado productos que coincidan con tu búsqueda.</div>`;

                        <div class="card-details">
                            <strong>Material:</strong> ${p.material}<br>
                            ${p.capacidad ? `<strong>Capacidad:</strong> ${p.capacidad}` : ''}
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Lógica del Modal
        function showModal(p) {
            document.getElementById('modalImg').src = p.imagen;
            document.getElementById('modalCat').textContent = p.categoria;
            document.getElementById('modalTitle').textContent = `${p.nombre} - ${p.id}`;
            
            const specsList = document.getElementById('modalSpecs');
            specsList.innerHTML = `
                <li><strong>Material:</strong> ${p.material}</li>
                <li><strong>Dimensiones:</strong> ${p.dimensiones}</li>
                ${p.capacidad ? `<li><strong>Capacidad:</strong> ${p.capacidad}</li>` : ''}
                <li><strong>Peso:</strong> ${p.peso}</li>
                ${p.extras ? `<li><strong>Detalles extra:</strong> ${p.extras}</li>` : ''}
            `;
            
            document.getElementById('modalOverlay').classList.add('open');
        }

        function closeModal() { 
            document.getElementById('modalOverlay').classList.remove('open'); 
        }

        // Eventos
        searchInput.addEventListener('input', renderizarCatalogo);
        categoryFilter.addEventListener('change', renderizarCatalogo);

        // Inicializar
        renderizarCatalogo();
    </script>
</body>
</html>
